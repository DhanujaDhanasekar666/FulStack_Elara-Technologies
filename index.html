<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elara Technologies - Corporate Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/modals.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Theme Toggle -->
    <div class="theme-toggle">
        <button class="theme-btn" id="themeToggle">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <!-- Login Page -->
    <div class="login-container" id="loginPage">
        <div class="login-box">
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-satellite-dish logo-icon"></i>
                    <div class="logo-text">ELARA TECHNOLOGIES</div>
                </div>
                <p>Sign in to access your dashboard</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-login">Login</button>
                
                <div class="form-group">
                    <label>Login as (for demo):</label>
                    <div class="role-selector">
                        <div class="role-btn" data-role="ceo">CEO</div>
                        <div class="role-btn" data-role="hr">HR</div>
                        <div class="role-btn" data-role="admin">Admin</div>
                        <div class="role-btn" data-role="manager">Manager</div>
                        <div class="role-btn" data-role="employee">Employee</div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
        <header>
            <div class="container">
                <div class="header-content">
                    <div class="header-logo">
                        <i class="fas fa-satellite-dish"></i>
                        <h1>Elara Technologies</h1>
                    </div>
                    <nav>
                        <ul>
                            <!-- Navigation items removed as requested -->
                        </ul>
                    </nav>
                    <div class="user-info">
                        <div class="user-avatar" id="userAvatar">JD</div>
                        <div>
                            <div id="userName">John Doe</div>
                            <div id="userRole">Employee</div>
                        </div>
                        <button class="btn btn-logout" id="logoutBtn">Logout</button>
                    </div>
                </div>
            </div>
        </header>

        <div class="dashboard-content">
            <div class="container">
                <div class="dashboard-header">
                    <h2 class="dashboard-title" id="dashboardTitle">Dashboard</h2>
                    <div id="currentDate">Monday, October 2, 2023</div>
                </div>
                
                <div class="dashboard-grid">
                    <div class="sidebar">
                        <ul class="sidebar-menu" id="sidebarMenu">
                            <!-- Menu items will be populated by JavaScript based on role -->
                        </ul>
                    </div>
                    
                    <div class="main-content">
                        <div class="content-column">
                            <div class="content-card" id="mainContent">
                                <!-- Main content will be populated by JavaScript based on role and menu selection -->
                            </div>
                        </div>
                        
                        <div class="sidebar-column">
                            <div class="content-card" id="notificationsCard">
                                <div class="card-header">
                                    <h3 class="card-title">Notifications</h3>
                                    <button class="btn-action btn-primary" id="viewAllNotifications">View All</button>
                                </div>
                                <div id="notificationsList">
                                    <!-- Notifications will be populated by JavaScript -->
                                </div>
                            </div>
                            
                            <div class="content-card" id="calendarCard">
                                <div class="card-header">
                                    <h3 class="card-title">Calendar</h3>
                                    <button class="btn-action btn-primary" id="viewCalendarBtn">View All</button>
                                </div>
                                <div class="calendar" id="miniCalendar">
                                    <!-- Mini calendar will be populated by JavaScript -->
                                </div>
                            </div>
                            
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <div class="container">
                <div class="footer-bottom">
                    <p>&copy; 2025 Elara Technologies. All rights reserved.</p>
                </div>
            </div>
        </footer>
    </div>

    <!-- JavaScript -->
    <script src="js/data.js"></script>
    <script src="js/api/config.js"></script>
    <script src="js/api/apiService.js"></script>
    <script src="js/api/authService.js"></script>
    <script src="js/api/dataService.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
